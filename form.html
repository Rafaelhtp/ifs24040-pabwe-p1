<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Formulir pendaftaran akun pengguna baru.">
  <title>Form Pendaftaran Akun</title>
</head>
<body>

  <!-- Navigasi Proyek -->
  <nav aria-label="Navigasi Utama">
    <a href="index.html">1. IMDb Top Movies</a> | 
    <a href="blog.html">2. Dev Blogs</a> | 
    <a href="form.html">3. Form Pendaftaran</a> | 
    <a href="cv.html">4. Curriculum Vitae</a>
  </nav>
  <hr />

  <!-- Landmark Main -->
  <main>
    <h1>Form Pendaftaran Akun</h1>

    <form action="" method="post">
      <fieldset>
        <legend>Daftar Akun</legend>

        <table>
          <tr>
            <td><label for="nama">Nama Lengkap:</label></td>
            <td><input type="text" id="nama" name="nama" /></td>
          </tr>
          <tr>
            <td>Jenis Kelamin:</td>
            <td>
              <input type="radio" id="laki" name="gender" value="Laki-Laki" />
              <label for="laki">Laki-Laki</label>
              <input type="radio" id="perempuan" name="gender" value="Perempuan" />
              <label for="perempuan">Perempuan</label>
            </td>
          </tr>
          <tr>
            <td><label for="tempat_lahir">Tempat Lahir:</label></td>
            <td><input type="text" id="tempat_lahir" name="tempat_lahir" /></td>
          </tr>
          <tr>
            <td><label for="tanggal_lahir">Tanggal Lahir:</label></td>
            <td><input type="date" id="tanggal_lahir" name="tanggal_lahir" /></td>
          </tr>
          <tr>
            <td><label for="agama">Agama:</label></td>
            <td>
              <select id="agama" name="agama">
                <option value="">--- Pilih Agama ---</option>
                <option value="Islam">Islam</option>
                <option value="Katolik">Katolik</option>
                <option value="Protestan">Protestan</option>
                <option value="Hindu">Hindu</option>
                <option value="Buddha">Buddha</option>
                <option value="Konghucu">Konghucu</option>
              </select>
            </td>
          </tr>
          <tr>
            <td>Hobi:</td>
            <td>
              <input type="checkbox" id="olahraga" name="hobi" value="Olahraga" />
              <label for="olahraga">Olahraga</label>
              <input type="checkbox" id="membaca" name="hobi" value="Membaca" />
              <label for="membaca">Membaca</label>
              <input type="checkbox" id="ngoding" name="hobi" value="Ngoding" />
              <label for="ngoding">Ngoding</label>
            </td>
          </tr>
          <tr>
            <td><label for="password">Password:</label></td>
            <td><input type="password" id="password" name="password" /></td>
          </tr>
          <tr>
            <td colspan="2">
              <input type="checkbox" id="persetujuan" name="persetujuan" />
              <label for="persetujuan">Dengan mendaftar saya setuju dengan Ketentuan dan Kebijakan Privasi Aplikasi.</label>
            </td>
          </tr>
          <tr>
            <td colspan="2">
              <input type="reset" value="Reset" />
              <input type="submit" value="Submit" />
            </td>
          </tr>
        </table>

      </fieldset>
    </form>
  </main>

</body>
</html>
